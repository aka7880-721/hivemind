name: macOS release packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to Cargo.toml version)"
        required: false
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Install Bash 5
        run: brew install bash

      - name: Make release script executable
        run: chmod +x scripts/releaseNOW.sh

      - name: Build macOS packages via releaseNOW.sh
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          BASH5="$(brew --prefix bash)/bin/bash"
          "$BASH5" --version | head -1
          if [[ -n "${RELEASE_VERSION_INPUT:-}" ]]; then
            echo "Requested version from workflow input: ${RELEASE_VERSION_INPUT}"
          fi
          "$BASH5" ./scripts/releaseNOW.sh --mac --no-checks

      - name: Upload macOS artifacts
        id: upload_macos_packages
        uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          path: |
            dist/latest/macos-*/**
            dist/old/macos-*/**
          if-no-files-found: ignore

      - name: Print macOS artifact download instructions
        if: steps.upload_macos_packages.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload_macos_packages.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload_macos_packages.outputs.artifact-id }}
        run: |
          set -euo pipefail
          run_page="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          api_zip="${GITHUB_SERVER_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "macOS packages ready (artifact: macos-packages)"
          echo "Workflow run:  ${run_page}"
          echo "Artifact page: ${ARTIFACT_URL}"
          echo ""
          echo "GitHub CLI (recommended; uses your gh auth):"
          echo "  gh run download ${GITHUB_RUN_ID} -n macos-packages -D dist"
          echo ""
          echo "curl (zip via REST API; set GITHUB_TOKEN or use gh auth token):"
          echo "  curl -fL \\"
          echo "    -H \"Authorization: Bearer \${GITHUB_TOKEN:-\$(gh auth token)}\" \\"
          echo "    -H \"Accept: application/vnd.github+json\" \\"
          echo "    \"${api_zip}\" -o macos-packages.zip"
          echo "  unzip -o macos-packages.zip -d dist"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::notice title=macOS artifact::gh run download ${GITHUB_RUN_ID} -n macos-packages -D dist"
