[package]
name = "comfygit"
version = "0.36.2"
edition = "2024"
rust-version = "1.95"
description = "Ratatui public edition of the original Comfy Version Bumper"
authors = ["ComfyHome™ <dev@comfyhome.io>"]
license = "SA-PS"
homepage = "https://github.com/comfy-home/ComfyGit"
repository = "https://github.com/comfy-home/ComfyGit"
readme = "README.md"
keywords = ["tui", "cli", "ratatui", "comfy", "comfyhome", "versioning", "version-management", "release-management", "version-bump", "git", "changelog", "semantic-versioning", "semver", "calver"]
categories = ["development-tools", "command-line-utilities", "command-line-interface"]

[package.metadata]
license-link = "https://github.com/comfy-home/ComfyGit?tab=License-1-ov-file"
minimum_required = "0.17.0"
minimum_required_reason = "Before 0.17.x, the app was in very early alpha stage..."

[[bin]]
name = "cg"
path = "src/main.rs"

[[bin]]
name = "ComfyGit"
path = "src/bin/cg-bin.rs"

[workspace]
exclude = [
    "src/components/comfy-toaster",
    "src/components/comfy-tabs",
    "src/components/comfy-text-engine",
]

[dependencies]
# Comfy dependencies
## ---------------------------------------------------------------
## T O A S T E R
# -
ratatui-comfy-toaster = "0.4"
#ratatui-comfy-toaster = { path = "src/components/comfy-toaster" }
#
## TABS
#ratatui-comfy-tabs = { path = "src/components/comfy-tabs" }
ratatui-comfy-tabs = "0.4"
#
## TEXT ENGINE
ratatui-comfy-text-engine = { path = "src/components/comfy-text-engine", default-features = true, features = ["markdown", "image"] }
#ratatui-comfy-text-engine = "0"
# E N D ----------------------------------------------------------
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
ctrlc = "3"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-explorer = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
configparser = "1.0"
roxmltree = "0.20"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "1"
toml_edit = "0.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tui-textarea = "0.7"
tui-overlay = "0.1.2"
tui-checkbox = "0.4.4"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# crates.io 0.29.0 pulls document-features unconditionally, which breaks cross builds
# (proc-macro crate unavailable for the target triple). Upstream fixed on master.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "17192310472778bf94566b027ac1be0abdd05a7c" }
